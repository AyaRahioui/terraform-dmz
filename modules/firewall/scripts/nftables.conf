#!/usr/sbin/nft -f
# /etc/nftables.conf — NVA DMZ (module firewall, M2)
# GÉNÉRÉ PAR TERRAFORM (templatefile) : modifier modules/firewall/scripts/nftables.conf,
# pas le fichier sur la VM. Pour un test manuel sur la VM : nft-safe-apply <fichier>.
#
# Politique : tout est refusé (drop) sauf les flux listés ci-dessous.

flush ruleset

define VNET      = ${vnet_cidr}
define DMZ_NET   = ${dmz_cidr}
define LAN_NET   = ${lan_cidr}
define MGMT_NET  = ${mgmt_cidr}
define MON_NET   = ${monitoring_cidr}
define WEB_IP    = ${web_ip}
define APP_IP    = ${app_ip}
define MON_IP    = ${monitoring_ip}
define BASTION_IP = ${bastion_ip}
# Remplacé au boot par l'IP de eth0 (celle sur laquelle Azure livre l'IP publique).
define NVA_IP    = ${nva_ip_placeholder}
# DHCP/DNS/santé Azure (168.63.129.16) et IMDS (169.254.169.254).
define AZURE_PLATFORM = { 168.63.129.16, 169.254.169.254 }

define DNAT_TCP   = { ${dnat_tcp_ports} }
define APP_TCP    = { ${app_tcp_ports} }
define SCRAPE_TCP = { ${scrape_tcp_ports} }
define INGEST_TCP = { ${ingest_tcp_ports} }
define EGRESS_TCP = { ${egress_tcp_ports} }
define EGRESS_UDP = { ${egress_udp_ports} }
define UI_TCP     = { ${ui_tcp_ports} }
%{ if admin_source_ips != "" ~}
define ADMIN_IPS  = { ${admin_source_ips} }
%{ endif ~}

table inet filter {
	# ANTI-LOCKOUT : la 1re règle de input autorise TOUJOURS le SSH depuis le bastion,
	# avant tout drop / ct state. Ne jamais insérer de règle au-dessus.
	chain input {
		type filter hook input priority filter; policy drop;
		ip saddr $MGMT_NET tcp dport 22 accept comment "anti-lockout: SSH depuis mgmt"
		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		ip saddr $AZURE_PLATFORM accept comment "plateforme Azure"
		meta l4proto icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
		ip saddr $MON_IP tcp dport $SCRAPE_TCP accept comment "supervision de la NVA"
		limit rate 5/minute log prefix "nft-in-drop: " level warn
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop

		# Internet -> DMZ : uniquement le trafic publié (DNAT) vers vm-web
		ip saddr != $VNET ip daddr $WEB_IP tcp dport $DNAT_TCP ct status dnat accept comment "publication web"

		# DMZ -> LAN : uniquement vm-web -> vm-app
		ip saddr $WEB_IP ip daddr $APP_IP tcp dport $APP_TCP accept comment "web -> app"

		# Administration : bastion -> toutes les VMs en SSH
		ip saddr $MGMT_NET ip daddr $VNET tcp dport 22 accept comment "SSH admin"
		ip saddr { $MGMT_NET, $MON_NET } ip daddr $VNET meta l4proto icmp accept comment "ping diag"

		# Supervision
		ip saddr $MON_IP ip daddr $VNET tcp dport $SCRAPE_TCP accept comment "scrape metrics"
		ip saddr $VNET ip daddr $MON_IP tcp dport $INGEST_TCP accept comment "F08 envoi logs"
		ip saddr $BASTION_IP ip daddr $MON_IP tcp dport $UI_TCP accept comment "F14 Grafana depuis bastion"
%{ if admin_source_ips != "" ~}

		# F06 : SSH admin depuis Internet (IP /32 autorisées) -> bastion, après DNAT
		ip saddr $ADMIN_IPS ip daddr $BASTION_IP tcp dport 22 ct status dnat accept comment "F06 admin -> bastion"
%{ endif ~}

		# Sortie Internet (mises à jour) depuis le VNet
		ip saddr $VNET ip daddr != $VNET tcp dport $EGRESS_TCP accept comment "egress tcp"
		ip saddr $VNET ip daddr != $VNET udp dport $EGRESS_UDP accept comment "egress udp"

		# Tentative de pivot depuis la DMZ : journalisée (puis drop par la policy)
		ip saddr $DMZ_NET ip daddr { $LAN_NET, $MGMT_NET, $MON_NET } limit rate 5/minute log prefix "nft-dmz-pivot: " level warn
		limit rate 10/minute log prefix "nft-fwd-drop: " level warn
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

table ip nat {
	chain prerouting {
		type nat hook prerouting priority dstnat; policy accept;
		# IP publique -> (Azure) -> NVA_IP -> vm-web
		ip daddr $NVA_IP ip saddr != $VNET tcp dport $DNAT_TCP dnat to $WEB_IP comment "F01 DNAT web"
%{ if admin_source_ips != "" ~}
		ip daddr $NVA_IP ip saddr $ADMIN_IPS tcp dport ${admin_ssh_dnat_port} dnat to $BASTION_IP:22 comment "F06 DNAT admin -> bastion"
%{ endif ~}
	}

	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		# Les VMs internes sortent sur Internet avec l'IP publique de la NVA
		oifname "${untrust_interface}" ip saddr $VNET ip daddr != $VNET masquerade comment "SNAT egress"
	}
}
